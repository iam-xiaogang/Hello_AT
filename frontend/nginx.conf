server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin proxies for the AI tools (Flask news dashboard + Streamlit).
  # Relative iframe srcs avoid mixed-content blocking on https deployments.
  location /news/ {
    proxy_pass http://154.36.185.251:5001/;
    proxy_set_header Host $host;
  }
  location /english-learning/ {
    proxy_pass http://154.36.185.251:8501;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  location / { try_files $uri $uri/ /index.html; }
}
